<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Verifying — Triss File Vault</title>
<style>
  :root {
    --accent: #2dd4bf;
    --card-bg: rgba(15, 30, 41, 0.72);
    --card-border: rgba(45, 212, 191, 0.22);
    --text-main: #e8f4f2;
    --text-muted: #8ba3ae;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 0;
    position: relative;
    overflow: hidden;
    background: #04060d;
  }

  /* ---------- Galaxy backdrop ---------- */
  .galaxy {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 38% at 22% 18%, rgba(124,58,237,0.32), transparent 60%),
      radial-gradient(ellipse 48% 32% at 82% 12%, rgba(45,212,191,0.20), transparent 60%),
      radial-gradient(ellipse 50% 40% at 75% 88%, rgba(236,72,153,0.15), transparent 60%),
      radial-gradient(ellipse 38% 28% at 8% 82%, rgba(45,212,191,0.13), transparent 60%),
      radial-gradient(circle at 50% 50%, #0b1220, #04060d 75%);
  }
  .stars, .stars2 {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-repeat: repeat;
  }
  .stars {
    background-image:
      radial-gradient(1.6px 1.6px at 15% 25%, #fff 0, transparent 100%),
      radial-gradient(1.2px 1.2px at 40% 65%, rgba(255,255,255,0.9) 0, transparent 100%),
      radial-gradient(1.8px 1.8px at 65% 15%, #fff 0, transparent 100%),
      radial-gradient(1.2px 1.2px at 85% 55%, rgba(255,255,255,0.8) 0, transparent 100%),
      radial-gradient(1.4px 1.4px at 25% 85%, rgba(255,255,255,0.9) 0, transparent 100%),
      radial-gradient(1.2px 1.2px at 90% 80%, rgba(255,255,255,0.7) 0, transparent 100%),
      radial-gradient(1.6px 1.6px at 55% 40%, #fff 0, transparent 100%);
    background-size: 340px 340px;
    animation: drift 90s linear infinite, twinkle 4s ease-in-out infinite;
  }
  .stars2 {
    background-image:
      radial-gradient(1px 1px at 10% 50%, rgba(255,255,255,0.5) 0, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0, transparent 100%),
      radial-gradient(1px 1px at 75% 70%, rgba(255,255,255,0.5) 0, transparent 100%),
      radial-gradient(1px 1px at 30% 90%, rgba(255,255,255,0.4) 0, transparent 100%);
    background-size: 220px 220px;
    animation: drift 60s linear infinite reverse;
    opacity: 0.7;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 1000px 500px; } }
  @keyframes twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* ---------- Floating planets ---------- */
  .planet {
    position: fixed; z-index: 0; pointer-events: none; border-radius: 50%;
    filter: blur(0.3px);
  }
  .planet-1 {
    width: 92px; height: 92px; top: 10%; left: 8%;
    background: radial-gradient(circle at 32% 30%, #a78bfa, #4c1d95 70%);
    box-shadow: 0 0 40px rgba(124,58,237,0.35);
    animation: floatY 9s ease-in-out infinite;
  }
  .planet-2 {
    width: 46px; height: 46px; top: 72%; left: 82%;
    background: radial-gradient(circle at 35% 30%, #5eead4, #0f766e 75%);
    box-shadow: 0 0 26px rgba(45,212,191,0.4);
    animation: floatY 7s ease-in-out infinite reverse;
  }
  .planet-3 {
    width: 30px; height: 30px; top: 20%; left: 85%;
    background: radial-gradient(circle at 35% 30%, #f9a8d4, #831843 75%);
    box-shadow: 0 0 18px rgba(236,72,153,0.4);
    animation: floatY 11s ease-in-out infinite;
  }
  .ringed {
    position: absolute; top: 50%; left: 50%;
    width: 150%; height: 34%;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-18deg);
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }

  /* ---------- Shooting star ---------- */
  .shooting-star {
    position: fixed; z-index: 0; pointer-events: none;
    width: 3px; height: 3px; border-radius: 50%; background: #fff;
    top: 15%; left: -5%;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.8);
    animation: shoot 6s linear infinite;
    animation-delay: 2s;
  }
  .shooting-star::before {
    content: ''; position: absolute; top: 50%; right: 0;
    width: 90px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7));
    transform: translateY(-50%);
  }
  @keyframes shoot {
    0% { transform: translate(0, 0); opacity: 0; }
    5% { opacity: 1; }
    25% { transform: translate(60vw, 30vh); opacity: 0; }
    100% { transform: translate(60vw, 30vh); opacity: 0; }
  }

  /* ---------- Card ---------- */
  .card {
    position: relative; z-index: 1;
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 30px 32px;
    width: 90%; max-width: 380px;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(45,212,191,0.05), 0 30px 60px rgba(0,0,0,0.55);
  }

  /* ---------- Orbit loader ---------- */
  .orbit-wrap {
    width: 96px; height: 96px;
    margin: 0 auto 22px;
    position: relative;
  }
  .orbit-core {
    position: absolute; top: 50%; left: 50%;
    width: 34px; height: 34px;
    margin: -17px 0 0 -17px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5eead4, #0f766e 75%);
    box-shadow: 0 0 22px rgba(45,212,191,0.65);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(45,212,191,0.55); }
    50% { box-shadow: 0 0 30px rgba(45,212,191,0.85); }
  }
  .orbit-ring {
    position: absolute; inset: 0;
    border: 1px dashed rgba(45,212,191,0.25);
    border-radius: 50%;
    animation: spin 6s linear infinite;
  }
  .orbit-dot {
    position: absolute; inset: 0;
    animation: spin 2.4s linear infinite;
  }
  .orbit-dot span {
    position: absolute; top: -4px; left: 50%;
    width: 8px; height: 8px; margin-left: -4px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px rgba(45,212,191,0.8);
  }
  .orbit-dot.d2 { animation-duration: 3.6s; animation-direction: reverse; }
  .orbit-dot.d2 span { background: #a78bfa; box-shadow: 0 0 10px rgba(167,139,250,0.8); width: 6px; height: 6px; margin-left: -3px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .eyebrow {
    font-size: 11px; letter-spacing: 3px; font-weight: 700;
    color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
  }
  h1 { font-size: 21px; color: var(--text-main); margin: 0 0 10px; font-weight: 600; }
  p.sub { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; margin: 0 0 22px; }

  .status-text {
    font-size: 13px; font-weight: 500; color: var(--text-main);
    min-height: 18px; margin-bottom: 22px;
    transition: opacity 0.25s ease;
  }

  .footline {
    font-size: 11.5px; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 16px;
  }
  .footline a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="galaxy"></div>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="shooting-star"></div>
  <div class="planet planet-1"><div class="ringed"></div></div>
  <div class="planet planet-2"></div>
  <div class="planet planet-3"></div>

  <div class="card">
    <div class="orbit-wrap">
      <div class="orbit-ring"></div>
      <div class="orbit-dot d1"><span></span></div>
      <div class="orbit-dot d2"><span></span></div>
      <div class="orbit-core">🪻</div>
    </div>
    <div class="eyebrow">Triss File Vault</div>
    <h1>Taking you back to Telegram</h1>
    <p class="sub">Just a moment — no need to do anything here.</p>
    <div class="status-text" id="statusText">Verification received…</div>
    <div class="footline">
      <span>🔒</span>
      <span>Secured session · <a id="manualLink" href="#">tap here if you're not redirected</a></span>
    </div>
  </div>

<script>
  // Cosmetic only - session_id/proof are read straight from this page's
  // own URL and used only to build the Telegram deep link below. No
  // verification of any kind happens on this page; the real proof +
  // timing-window check happens entirely server-side once Telegram
  // receives the /start (see triss/services/shortener.py).
  const params = new URLSearchParams(window.location.search);
  const sid = params.get('s') || '';
  const proof = params.get('p') || '';
  const botUsername = '{{BOT_USERNAME}}';
  const deepLink = `https://t.me/${botUsername}?start=verify_${sid}${proof}`;
  document.getElementById('manualLink').href = deepLink;

  const statusText = document.getElementById('statusText');
  const messages = ['Verification received…', 'Confirming your session…', 'Opening Telegram…'];
  let i = 0;
  function nextMessage() {
    statusText.style.opacity = 0;
    setTimeout(() => {
      statusText.textContent = messages[i];
      statusText.style.opacity = 1;
      i++;
    }, 200);
  }
  nextMessage();
  const interval = setInterval(() => {
    if (i < messages.length) nextMessage();
    else clearInterval(interval);
  }, 650);

  setTimeout(() => { window.location.href = deepLink; }, 1700);
</script>
</body>
</html>
